name: Deploy FMP Ingestor (Cloud Functions)

on:
  push:
    branches:
      - main
    paths:
      - 'src/fmp/**'

env:
  PROJECT_ID: 'mike-personal-portfolio'
  REGION: 'us-central1'
  FUNCTION_NAME: 'fmp-ingestor'
  RUNTIME: 'python311'
  TIMEOUT: '540'  # 9 minutes for full pipeline
  MEMORY: '512Mi'  # Higher memory for reliable API operations

jobs:
  ci-checks:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Formatting with Black
        uses: psf/black@stable
        with:
          src: "./src/fmp"
          options: '--check'

      - name: Security Scan with bandit
        run: |
          pip install bandit
          bandit -r ./src/fmp -lll

      - name: Install Dependencies and Run Tests
        run: |
          pip install -r src/fmp/requirements.txt -r src/fmp/requirements-test.txt
          pytest src/fmp/tests/ -v --cov=src/fmp --cov-report=term-missing --cov-fail-under=70


  deploy:
    runs-on: ubuntu-latest
    needs: ci-checks
    permissions:
      id-token: 'write'
      contents: 'read'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/166016129616/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider-v2'
          service_account: 'github-actions-sa@mike-personal-portfolio.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # Deploy Cloud Function with HTTP trigger
      - name: Deploy Cloud Function
        run: |
          gcloud functions deploy ${{ env.FUNCTION_NAME }} \
            --gen2 \
            --runtime=${{ env.RUNTIME }} \
            --region=${{ env.REGION }} \
            --source=src/fmp \
            --entry-point=run_fmp_ingestion \
            --trigger-http \
            --timeout=${{ env.TIMEOUT }} \
            --memory=${{ env.MEMORY }} \
            --max-instances=1 \
            --project=${{ env.PROJECT_ID }} \
            --set-env-vars PROJECT_ID=${{ env.PROJECT_ID }} \
            --set-env-vars LOG_LEVEL=INFO \
            --set-secrets API_KEY=fmp_api_key:latest

      # Verify deployment
      - name: Verify Deployment
        run: |
          gcloud functions describe ${{ env.FUNCTION_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --gen2

      # Display invocation details
      - name: Display Invocation Info
        run: |
          echo "===== FUNCTION DEPLOYED ===="
          echo "Name: ${{ env.FUNCTION_NAME }}"
          echo "Region: ${{ env.REGION }}"
          echo "Trigger: HTTP"
          echo ""
          echo "To manually trigger the function via HTTP, run:"
          echo "  gcloud functions call ${{ env.FUNCTION_NAME }} --gen2 --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }}"
          echo ""
          echo "To schedule daily runs, create a Cloud Scheduler job that sends HTTP POST requests to the function's URL"
