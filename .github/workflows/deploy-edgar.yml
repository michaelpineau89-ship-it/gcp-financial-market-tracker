name: Deploy Edgar fillings Web Scraper Cloud Run Function

on:
  push:
    branches:
      - main
    # THIS IS THE MAGIC: Only trigger if files in this specific folder change
    paths:
      - 'src/edgar/**'

env:
  PROJECT_ID: 'mike-personal-portfolio'
  REGION: 'us-central1'
  REPO_NAME: 'financial-trackers' # Your Artifact Registry repo
  SERVICE_NAME: 'edgar'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Pull down your repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Authenticate securely to GCP using Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/YOUR_PROJECT_NUMBER/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-runner@mike-personal-portfolio.iam.gserviceaccount.com'

      # Step 3: Configure Docker to talk to your GCP Artifact Registry
      - name: Docker Auth
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # Step 4: Build the container and push it to Artifact Registry
      - name: Build and Push Container
        run: |-
          DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t $DOCKER_TAG src/edgar
          docker push $DOCKER_TAG

      # Step 5: Tell Cloud Run to spin up the new image
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}