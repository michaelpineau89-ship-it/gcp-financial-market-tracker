name: Deploy Alpha Vantage Ingestor (Cloud Functions)

on:
  push:
    branches:
      - main
    paths:
      - 'src/alphavantage/**'

env:
  PROJECT_ID: 'mike-personal-portfolio'
  REGION: 'us-central1'
  FUNCTION_NAME: 'alphavantage-ingestor'
  RUNTIME: 'python311'
  TIMEOUT: '600'  # 10 minutes for rate-limited API calls
  MEMORY: '1024MB'
  PUBSUB_TOPIC: 'alphavantage-ingestion-trigger'

jobs:
  ci-checks:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Formatting with Black
        uses: psf/black@stable
        with:
          src: "./src/alphavantage"
          options: '--check'

      - name: Security Scan with bandit
        run: |
          pip install bandit
          bandit -r ./src/alphavantage -lll

      - name: Install Dependencies and Run Tests
        run: |
          pip install -r src/alphavantage/requirements.txt -r src/alphavantage/requirements-test.txt
          pytest src/alphavantage/tests/ -v --cov=src/alphavantage --cov-report=term-missing --cov-fail-under=70


  deploy:
    runs-on: ubuntu-latest
    needs: ci-checks
    permissions:
      id-token: 'write'
      contents: 'read'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/166016129616/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider-v2'
          service_account: 'github-actions-sa@mike-personal-portfolio.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # Deploy Cloud Function with Pub/Sub trigger
      - name: Deploy Cloud Function
        run: |
          gcloud functions deploy ${{ env.FUNCTION_NAME }} \
            --gen2 \
            --runtime=${{ env.RUNTIME }} \
            --region=${{ env.REGION }} \
            --source=src/alphavantage \
            --entry-point=run_alphavantage_ingestion \
            --trigger-topic=${{ env.PUBSUB_TOPIC }} \
            --timeout=${{ env.TIMEOUT }} \
            --memory=${{ env.MEMORY }} \
            --project=${{ env.PROJECT_ID }} \
            --set-env-vars PROJECT_ID=${{ env.PROJECT_ID }} \
            --set-env-vars LOG_LEVEL=INFO \
            --set-secrets API_KEY=alphavantage_api_key:latest \
            --allow-unauthenticated=false

      # Verify deployment
      - name: Verify Deployment
        run: |
          gcloud functions describe ${{ env.FUNCTION_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --gen2

      # Display invocation details
      - name: Display Invocation Info
        run: |
          echo "===== FUNCTION DEPLOYED ====="
          echo "Name: ${{ env.FUNCTION_NAME }}"
          echo "Region: ${{ env.REGION }}"
          echo "Trigger: Pub/Sub Topic '${{ env.PUBSUB_TOPIC }}'"
          echo ""
          echo "To manually trigger the function, run:"
          echo "  gcloud pubsub topics publish ${{ env.PUBSUB_TOPIC }} --message '{\"action\": \"ingest\"}' --project=${{ env.PROJECT_ID }}"
