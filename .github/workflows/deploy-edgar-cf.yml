name: Deploy EDGAR Ingestor (Cloud Functions)

on:
  push:
    branches:
      - main
    paths:
      - 'src/edgar/**'

env:
  PROJECT_ID: 'mike-personal-portfolio'
  REGION: 'us-central1'
  FUNCTION_NAME: 'edgar-ingestor'
  RUNTIME: 'python311'
  TIMEOUT: '540'  # 9 minutes (max for event-triggered functions)
  MEMORY: '1024MB'
  PUBSUB_TOPIC: 'daily-market-ingestion-trigger'

jobs:
  ci-checks:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Formatting with Black
        uses: psf/black@stable
        with:
          src: "./src/edgar"
          options: '--check'

      - name: Security Scan with bandit
        run: |
          pip install bandit
          bandit -r ./src/edgar -lll

      - name: Install Dependencies and Run Tests
        run: |
          pip install -r src/edgar/requirements.txt -r src/edgar/requirements-test.txt
          pytest src/edgar/tests/ -v --cov=src/edgar --cov-report=term-missing --cov-fail-under=70


  deploy:
    runs-on: ubuntu-latest
    needs: ci-checks
    permissions:
      id-token: 'write'
      contents: 'read'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/166016129616/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider-v2'
          service_account: 'github-actions-sa@mike-personal-portfolio.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Deploy to Cloud Functions
        run: |
          gcloud functions deploy ${{ env.FUNCTION_NAME }} \
            --gen2 \
            --runtime=${{ env.RUNTIME }} \
            --region=${{ env.REGION }} \
            --source=src/edgar \
            --entry-point=run_edgar_ingestion \
            --trigger-topic=${{ env.PUBSUB_TOPIC }} \
            --timeout=${{ env.TIMEOUT }} \
            --memory=${{ env.MEMORY }} \
            --project=${{ env.PROJECT_ID }} \
            --set-env-vars PROJECT_ID=${{ env.PROJECT_ID }} \
            --quiet

      - name: Verify Deployment
        run: |
          gcloud functions describe ${{ env.FUNCTION_NAME }} \
            --region=${{ env.REGION }} \
            --gen2 \
            --project=${{ env.PROJECT_ID }}
