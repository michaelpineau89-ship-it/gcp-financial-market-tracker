version: 2

sources:
  - name: bronze
    database: mike-personal-portfolio
    schema: market_tracker
    description: Raw ingested data from all bronze Cloud Function ingestors

    tables:
      # Alpha Vantage
      - name: bronze_alpha_quotes
        description: Real-time stock quotes from Alpha Vantage GLOBAL_QUOTE endpoint
        columns:
          - name: symbol
          - name: open
          - name: high
          - name: low
          - name: price
          - name: volume
          - name: trading_date
          - name: previous_close
          - name: price_change
          - name: change_percent_str
          - name: change_percent
          - name: _ingested_at

      # Finnhub
      - name: bronze_finnhub_news
        description: Company news from Finnhub for the past 14 days
        columns:
          - name: ticker
          - name: period_end_date
          - name: period
          - name: currency
          - name: cik
          - name: accepted_date
          - name: fiscal_year
          - name: cost_of_revenue
          - name: gross_profit
          - name: r_and_d_expenses
          - name: general_and_admin_expenses
          - name: selling_and_marketing_expenses
          - name: other_expenses
          - name: cost_and_expenses
          - name: net_interest_income
          - name: interest_income
          - name: interest_expense
          - name: depreciation_and_amortization
          - name: ebit
          - name: ebitda
          - name: non_operating_income_excluding_interest
          - name: operating_income
          - name: total_other_income_expenses_net
          - name: income_before_tax
          - name: income_tax_expense
          - name: net_income_from_continuing_operations
          - name: net_income_from_discontinued_operations
          - name: other_adjustments
          - name: net_income
          - name: eps
          - name: eps_diluted
          - name: weighted_average_shs_out
          - name: weighted_average_shs_out_diluted
          - name: _ingested_at

      - name: bronze_finnhub_recommendations
        description: Analyst recommendation trends from Finnhub
        columns:
          - name: ticker
          - name: period
          - name: strong_buy
          - name: buy
          - name: hold
          - name: sell
          - name: strong_sell
          - name: total_bullish
          - name: total_bearish
          - name: _ingested_at

      - name: bronze_finnhub_financials
        description: Basic financial metrics from Finnhub
        columns:
          - name: ticker
          - name: metric
          - name: series
          - name: _ingested_at

      - name: bronze_finnhub_insider
        description: Insider sentiment data from Finnhub
        columns:
          - name: ticker
          - name: year
          - name: month
          - name: period
          - name: period_start
          - name: net_purchase_shares
          - name: net_purchase_ratio
          - name: monthly_share_purchase_ratio
          - name: _ingested_at

      # EDGAR
      - name: bronze_edgar_submissions
        description: SEC EDGAR company submission metadata
        columns:
          - name: cik
          - name: entity_name
          - name: form_type
          - name: file_number
          - name: entity
          - name: primary_doc_description
          - name: accession_number

      - name: bronze_edgar_13f
        description: SEC 13F-HR institutional holdings filings
        columns:
          - name: cik
          - name: entity_name
          - name: filing_date
          - name: period_of_report
          - name: issuer_name
          - name: class_title
          - name: cusip
          - name: value_thousand_usd
          - name: value_usd
          - name: shares
          - name: _ingested_at

      # Financial Modeling Prep
      - name: bronze_fmp_income
        description: Income statements from FMP
        columns:
          - name: symbol
          - name: period_end_date
          - name: period
          - name: currency
          - name: cik
          - name: accepted_date
          - name: fiscal_year
          - name: revenue
          - name: costOfRevenue
          - name: grossProfit
          - name: r_and_d_expenses
          - name: general_and_admin_expenses
          - name: selling_and_marketing_expenses
          - name: selling_general_and_admin_expenses
          - name: other_expenses
          - name: cost_and_expenses
          - name: net_interest_income
          - name: interest_income
          - name: interest_expense
          - name: depreciation_and_amortization
          - name: ebit
          - name: ebitda
          - name: non_operating_income_excluding_interest
          - name: operating_income
          - name: total_other_income_expenses_net
          - name: income_before_tax
          - name: income_tax_expense
          - name: net_income_from_continuing_operations
          - name: net_income_from_discontinued_operations
          - name: other_adjustments
          - name: net_income
          - name: eps
          - name: eps_diluted
          - name: weighted_average_shs_out
          - name: weighted_average_shs_out_diluted
          - name: gross_margin
          - name: net_margin
          - name: _ingested_at

      - name: bronze_fmp_balance
